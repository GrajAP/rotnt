name: android apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the GitHub release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Wire up release signing and ABI splits
        run: node scripts/patch-signing.mjs

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ROTNT_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::secret ROTNT_KEYSTORE_B64 is not set"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/rotnt.keystore

      - name: Assemble release APKs
        env:
          ORG_GRADLE_PROJECT_ROTNT_STORE_FILE: rotnt.keystore
          ORG_GRADLE_PROJECT_ROTNT_KEY_ALIAS: ${{ secrets.ROTNT_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ROTNT_STORE_PASSWORD: ${{ secrets.ROTNT_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ROTNT_KEY_PASSWORD: ${{ secrets.ROTNT_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/*.apk

      # gh handles the "file#asset-name" syntax; softprops/action-gh-release
      # does not, and silently matches nothing against the '#'.
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd android/app/build/outputs/apk/release
          test -f app-universal-release.apk
          test -f app-arm64-v8a-release.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file "$GITHUB_WORKSPACE/NOTES.md"
          fi
          gh release upload "$TAG" \
            app-universal-release.apk#rotnt.apk \
            app-arm64-v8a-release.apk#rotnt-arm64.apk \
            --clobber
          gh release view "$TAG"
